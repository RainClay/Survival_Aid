plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

// No dependencies to avoid Minecraft setup

afterEvaluate {
    def loomExt = project.extensions.findByName("loom")
    if (loomExt != null) {
        println "=== Loom extension type: ${loomExt.class.name} ==="
        def methods = loomExt.class.methods.findAll { m ->
            !m.name.contains('$') && !['wait','equals','hashCode','toString','getClass','notify','notifyAll'].contains(m.name)
        }.sort { it.name }
        println "=== Methods (${methods.size()}) ==="
        methods.each { m ->
            println "  ${m.name}(${m.parameterTypes*.simpleName.join(', ')}) -> ${m.returnType.simpleName}"
        }
    }
}
